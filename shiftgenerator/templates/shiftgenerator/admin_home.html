{% extends "base.html" %}
{% block content %}
  <div class="container mt-5">
    <div class="text-center mb-5">
      <h1 class="display-4 mb-2">管理者ホーム</h1>
      <p class="lead text-secondary">シフト管理・提出状況の確認・全体調整ができます</p>
    </div>
    <div class="row justify-content-center">

      <!-- シフト管理 -->
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm border-success h-100">
          <div class="card-body text-center">
             <div class="mb-2" style="font-size:2.5rem; color:#0d6efd;">
            <i class="bi bi-eye"></i>
        </div>
            <h5 class="card-title">シフト管理</h5>
            <div class="d-flex flex-column align-items-center gap-2">
            <p class="card-text text-muted small mb-3">シフト・スタッフの編集・確定作業はこちら</p>
            <a href="{% url 'shiftgenerator:shift-management' %}" class="btn btn-primary btn-block mb-2 w-100">管理画面へ</a>
            <a href="{% url 'shiftgenerator:staff-management' %}" class="btn btn-primary btn-block w-100">スタッフ管理画面へ</a>
            </div>
          </div>
        </div>
      </div>

    <!-- Excel出力 -->
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm border-warning h-100">
        <div class="card-body text-center">
          <div class="mb-2" style="font-size:2.5rem; color:#fd7e14;">
            <i class="bi bi-file-earmark-excel"></i>
          </div>
          <h5 class="card-title">Excel出力</h5>
          <p class="card-text text-muted small mb-3">
            確定シフトを現場Excel形式で出力
          </p>
          <a href="{% url 'shiftgenerator:excel-export' %}"
            class="btn btn-warning btn-block w-100">
            Excel出力・設定画面へ
          </a>
        </div>
      </div>
    </div>

      <!-- シフト提出状況 -->
    <div class="col-md-4 mb-4">
    <div class="card shadow-sm border-success h-100">
        <div class="card-body text-center">
        <div class="mb-2" style="font-size:2.5rem; color:#198754;">
            <i class="bi bi-eye"></i>
        </div>
        <h5 class="card-title">シフト提出状況</h5>
        <p class="card-text text-muted small mb-3">全スタッフの提出状況を閲覧できます</p>
        <div class="d-flex flex-column align-items-center gap-2">
            <a href="{% url 'shiftgenerator:shift-management-view' %}" class="btn btn-success btn-block mb-2 w-100">
            募集期間作成 ＆ 集計ダッシュボード
            </a>
            <a href="{% url 'shiftgenerator:shift-calendar-view' %}" class="btn btn-success btn-block w-100">
            カレンダービュー
            </a>
        </div>
        </div>
    </div>
    </div>


      <!-- シフト希望カレンダー -->
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm border-info h-100">
          <div class="card-body text-center">
            <div class="mb-2" style="font-size:2.5rem; color:#0dcaf0;">
              <i class="bi bi-calendar-check"></i>
            </div>
            <h5 class="card-title">シフト希望カレンダー</h5>
            <p class="card-text text-muted small mb-3">自分自身の希望も入力・確認できます</p>
            <a href="{% url 'shiftgenerator:shift-form' %}" class="btn btn-info btn-block text-white">希望入力ページ</a>
          </div>
        </div>
      </div>
      
    </div>
  </div>

  <!-- ログアウトボタン -->
  <div class="mt-3 mt-md-0">
    <form action="{% url 'shiftgenerator:logout' %}" method="post" class="d-inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-danger">
        <i class="bi bi-box-arrow-right"></i> ログアウト
      </button>
    </form>
  </div>
{% endblock %}
