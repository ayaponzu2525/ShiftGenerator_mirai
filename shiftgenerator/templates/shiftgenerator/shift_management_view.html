<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>シフト提出状況（集計ダッシュボード）</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <style>
    .period-inputs label { font-weight: 500; }
    .status-badge { font-size: 1rem; padding: 0.5em 1em; border-radius: 1em; }
    .status-complete { background: #4caf50; color: #fff; }
    .status-partial { background: #ffc107; color: #333; }
    .status-none { background: #dc3545; color: #fff; }
    .table td, .table th { vertical-align: middle !important; }
    .mt-3 { margin-top: 1rem !important; }
    .mb-4 { margin-bottom: 1.5rem !important; }
  </style>
</head>
<body class="bg-light">
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">シフト提出状況（集計）</h2>
    <a href="{% url 'shiftgenerator:admin-home' %}" class="btn btn-outline-primary">
      <i class="fas fa-home mr-2"></i>管理者ホームに戻る
    </a>
  </div>

  <!-- 期間選択フォーム -->
  <div class="period-inputs d-flex flex-wrap align-items-end mb-3" style="gap:16px;">
    <label for="startDate" class="mb-0">集計期間：</label>
    <input type="date" id="startDate" class="form-control" style="min-width: 140px;">
    <span class="mx-2">〜</span>
    <input type="date" id="endDate" class="form-control" style="min-width: 140px;">
    <button id="reloadBtn" class="btn btn-primary ml-3">集計する</button>
    <button id="exportBtn" class="btn btn-success ml-2">Excelでダウンロード</button>
  </div>

  <!-- 提出日ごとサマリ表示（ここにグラフ/テーブル等をJSで挿入）-->
  <div id="summary"></div>
</div>

<script>
  // ===== あなたの関数そのまま =====
  function getNextHalfMonthRange() {
    const today = new Date();
    const y = today.getFullYear();
    const m = today.getMonth();
    const d = today.getDate();

    let start, end;
    if (d <= 15) {
      // 1〜15日 → 今月16日〜月末
      start = new Date(y, m, 16);
      end   = new Date(y, m + 1, 0); // 月末日
    } else {
      // 16日以降 → 来月1日〜15日
      start = new Date(y, m + 1, 1);
      end   = new Date(y, m + 1, 15);
    }

    function formatDateLocal(date) {
      const yyyy = date.getFullYear();
      const mm   = String(date.getMonth() + 1).padStart(2, '0');
      const dd   = String(date.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    return {
      start: formatDateLocal(start),
      end:   formatDateLocal(end)
    };
  }

  // ===== ページ初期表示でデフォルト期間をセット =====
  $(document).ready(function(){
    const range = getNextHalfMonthRange();
    $('#startDate').val(range.start);
    $('#endDate').val(range.end);
    loadSummary(range.start, range.end);
  });

  // ===== 集計・再読み込みボタン =====
  $('#reloadBtn').on('click', function(){
    const start = $('#startDate').val();
    const end   = $('#endDate').val();
    loadSummary(start, end);
  });

  // ===== ダウンロードボタン =====
  $('#exportBtn').on('click', function(){
    const start = $('#startDate').val();
    const end   = $('#endDate').val();
    window.location.href = `/shift-management-export/?start=${start}&end=${end}`;
  });

  // ===== 集計結果の取得＆描画（Ajaxでサンプル） =====
  function loadSummary(start, end) {
    $('#summary').html('<div class="text-center text-muted my-5">読み込み中...</div>');
    // サンプルAPI呼び出し。実際はviews.pyで作って返す
    $.getJSON('/shift-management-summary/', {start, end}, function(data){
      let html = `
        <table class="table table-bordered bg-white">
          <thead>
            <tr>
              <th>日付</th>
              <th>提出済み人数</th>
              <th>未提出スタッフ</th>
              <th>提出状況</th>
            </tr>
          </thead>
          <tbody>
      `;
      data.summary.forEach(day => {
        let statusClass = 'status-none', statusText = '未提出';
        if (day.submitted === day.total) {
          statusClass = 'status-complete'; statusText = '全員提出';
        } else if (day.submitted > 0) {
          statusClass = 'status-partial'; statusText = '一部提出';
        }
        html += `
          <tr>
            <td>${day.date}</td>
            <td><span class="badge badge-pill badge-primary" style="font-size:1em;">${day.submitted} / ${day.total}</span></td>
            <td>
              ${day.unsubmitted.length > 0 
                ? day.unsubmitted.map(name => `<span class="badge badge-danger mr-1">${name}</span>`).join('') 
                : '<span class="badge badge-success">全員提出</span>'}
            </td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          </tr>
        `;
      });
      html += `</tbody></table>`;
      $('#summary').html(html);
    })
    .fail(function(){
      $('#summary').html('<div class="text-danger my-5 text-center">集計データの取得に失敗しました。</div>');
    });
  }
</script>

<!-- fontawesome for home icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</body>
</html>
