{% extends "base.html" %}
{% block content %}
<div class="container">
    <h3>{{ staff.name }} のパスワード変更</h3>
    <form method="post">
        {% csrf_token %}
        <input type="password" name="password" class="form-control" placeholder="新しいパスワード">
        <button type="submit" class="btn btn-warning">変更</button>
    </form>
</div>
{% endblock %}
