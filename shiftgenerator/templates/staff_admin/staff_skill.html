{% extends "base.html" %}
{% block content %}
<div class="container">
    <h3>{{ staff.name }}のスキル編集</h3>
    <form method="post">
        {% csrf_token %}
        {% for skill in skills %}
        <div>
            <label>
                <input type="checkbox" name="skills" value="{{ skill.id }}" {% if skill.id in owned %}checked{% endif %}>
                {{ skill.skill_name }}
            </label>
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">保存</button>
    </form>
</div>
{% endblock %}
